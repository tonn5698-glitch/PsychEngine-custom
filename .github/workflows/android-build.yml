name: Android Build

on:
  push:
    branches: [main, debug]
    paths:
      - 'source/**'
      - 'assets/**'
      - 'Project.xml'
      - 'setup/**'
      - '.github/workflows/**'
      - 'key.keystore'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    uses: ./.github/workflows/build.yml
    with:
        name: Android
        os: macos-15
        setupCommand: sh ./setup/unix.sh
        buildArgs: ${{ github.ref_name == 'debug' && 'android -debug -arm64' || 'android -final -arm64' }}
        artifactName: ${{ github.ref_name == 'debug' && 'androidBuild-debug' || 'androidBuild' }}
        artifactPath: ${{ github.ref_name == 'debug' && 'export/debug/android/bin/app/build/outputs/apk/debug/*.apk' || 'export/release/android/bin/app/build/outputs/apk/release/*.apk' }}