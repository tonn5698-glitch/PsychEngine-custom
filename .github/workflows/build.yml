name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PsychEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r27c
          add-to-path: true
          local-cache: true

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt install libvlc-dev libvlccore-dev

      # Cache dependencies between source-only builds. The exact key changes when
      # dependency pins, project libraries, or this install workflow changes.
      # No restore-keys: never reuse a cache built from different dependency definitions.
      - name: Cache haxelib (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ hashFiles('setup/unix.sh', 'Project.xml') }}

      - name: Cache haxelib (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/AppData/Roaming/Haxe/haxelib
          key: haxelib-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ hashFiles('setup/windows.bat', 'Project.xml') }}

      - name: Install Libraries
        run: ${{ inputs.setupCommand }}

      - name: Install hxdr_libs (mp3 support)
        shell: bash
        run: |
          HAXELIB_PATH="$(haxelib config)"
          if [ ! -d "$HAXELIB_PATH/hxdr_libs/git" ]; then
            haxelib git hxdr_libs https://github.com/MAJigsaw77/hxdr_libs.git
          fi
          # thêm vào Project.xml nếu chưa có (để define hxdr_libs được bật)
          grep -q 'hxdr_libs' Project.xml || perl -0pi -e 's#</project>#\t<haxelib name="hxdr_libs" />\n</project>#' Project.xml
          grep -n 'hxdr_libs' Project.xml

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      # Use hxcpp's content-addressed cache instead of caching generated obj folders.
      # It hashes source/dependency contents and compiler flags, so regenerated C++ files
      # can still reuse previously compiled objects across clean GitHub runners.
      - name: Configure hxcpp compile cache
        if: inputs.name == 'Android'
        shell: bash
        run: |
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp-cache" >> "$GITHUB_ENV"
          echo "HXCPP_CACHE_MB=2000" >> "$GITHUB_ENV"

      - name: Cache hxcpp compile cache
        if: inputs.name == 'Android'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hxcpp-cache
          key: hxcpp-compile-${{ runner.os }}-android-${{ env.HAXE_VERSION }}-${{ hashFiles('setup/unix.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hxcpp-compile-${{ runner.os }}-android-${{ env.HAXE_VERSION }}-${{ hashFiles('setup/unix.sh') }}-

      - name: Cache Gradle
        if: inputs.name == 'Android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            export/debug/android/bin/.gradle
            export/release/android/bin/.gradle
          key: gradle-${{ runner.os }}-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-android-

      - name: Report the compiler that will be used
        if: inputs.name == 'Android'
        run: |
          echo "PATH head: $(echo "$PATH" | cut -d: -f1-3)"
          echo "which clang++: $(command -v clang++)"
          clang++ --version || true
          ls -1 "$(dirname "$(command -v clang++)")" | grep -iE '^ld|lld' || true

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
