name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PsychEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r27c
          add-to-path: true
          local-cache: true

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt install libvlc-dev libvlccore-dev

      # Không cache ~/haxelib: các lib cài bằng git (hxcpp, lime, flixel...) bị upstream đổi/force-push
      # sẽ làm `git pull` trong bước cài lib báo "divergent branches" (exit 128). Cài mới mỗi lần cho chắc.
      - name: Git config
        shell: bash
        run: git config --global pull.rebase false

      - name: Install Libraries
        run: ${{ inputs.setupCommand }}

      - name: Install hxdr_libs (mp3 support)
        shell: bash
        run: |
          haxelib git hxdr_libs https://github.com/MAJigsaw77/hxdr_libs.git
          # thêm vào Project.xml nếu chưa có (để define hxdr_libs được bật)
          grep -q 'hxdr_libs' Project.xml || perl -0pi -e 's#</project>#\t<haxelib name="hxdr_libs" />\n</project>#' Project.xml
          grep -n 'hxdr_libs' Project.xml

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache hxcpp build objects
        if: inputs.name == 'Android'
        uses: actions/cache@v5
        with:
          path: |
            export/debug/android/obj
            export/release/android/obj
          key: hxcpp-${{ runner.os }}-android-${{ hashFiles('setup/unix.sh') }}
          restore-keys: |
            hxcpp-${{ runner.os }}-android-

      - name: Cache Gradle
        if: inputs.name == 'Android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            export/debug/android/bin/.gradle
            export/release/android/bin/.gradle
          key: gradle-${{ runner.os }}-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-android-

      - name: Report the compiler that will be used
        if: inputs.name == 'Android'
        run: |
          echo "PATH head: $(echo "$PATH" | cut -d: -f1-3)"
          echo "which clang++: $(command -v clang++)"
          clang++ --version || true
          ls -1 "$(dirname "$(command -v clang++)")" | grep -iE '^ld|lld' || true

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
